<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boston's ReefWorks — V4 Lineup</title>
<meta name="description" content="Nano saltwater reef tanks, built in Pawnee, Illinois. Seven models, under five gallons each.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2304070f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2367e8f9'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#030509; --panel:#0a0f18; --ink:#f2f5f8; --muted:#8b9bb0; --faint:#525f73;
    --accent:#38bdf8; --lime:#a3e635; --line:rgba(148,184,220,.14);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --cond:"Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .hero{position:relative;min-height:92svh;display:flex;flex-direction:column;overflow:hidden;
    background:
      linear-gradient(180deg, rgba(56,189,248,.08), transparent 40%),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(148,184,220,.025) 3px 4px)}
  .hero-inner{position:relative;z-index:2;display:flex;flex-direction:column;min-height:92svh}
  nav.top{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.25rem;border-bottom:1px solid var(--line)}
  .brand{font-family:var(--cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.95rem;color:var(--ink);text-decoration:none}
  .brand span{color:var(--accent)}
  .nav-links{display:flex;gap:1.25rem;align-items:center}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:.85rem}
  .nav-cta{border:1px solid var(--accent);border-radius:4px;padding:.5rem 1rem;color:var(--accent)!important;font-size:.8rem!important;font-weight:600}
  .hero-copy{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 1.25rem;max-width:60rem}
  .kicker{display:inline-flex;align-items:center;gap:.6rem;color:var(--lime);font-size:.75rem;letter-spacing:.24em;
    text-transform:uppercase;margin-bottom:1.5rem;font-weight:600}
  .kicker::before{content:"";width:2rem;height:2px;background:var(--lime)}
  h1{font-family:var(--cond);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;
    font-size:clamp(3rem,13vw,7.5rem);line-height:.95;margin-bottom:1.5rem}
  h1 .thin{display:block;color:transparent;-webkit-text-stroke:1.5px var(--muted);font-weight:700}
  .lede{color:var(--muted);font-size:clamp(1rem,4.2vw,1.2rem);line-height:1.6;max-width:36rem;margin-bottom:2.25rem}
  .lede strong{color:var(--ink)}
  .btn{display:inline-block;text-decoration:none;padding:1rem 2.2rem;font-size:.95rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .btn-solid{background:var(--accent);color:#032635}
  .btn-ghost{border:1px solid var(--line);color:var(--ink);margin-left:.75rem}
  .hero-meta{display:flex;gap:2rem;padding:1.25rem;border-top:1px solid var(--line);color:var(--faint);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
  .hero-meta b{color:var(--ink);display:block;font-size:1.05rem;letter-spacing:0;margin-bottom:.2rem}
  section{padding:5rem 1.25rem;position:relative}
  .wrap{max-width:64rem;margin:0 auto}
  .section-kicker{color:var(--lime);font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;margin-bottom:1rem;font-weight:700}
  h2{font-family:var(--cond);font-weight:800;text-transform:uppercase;font-size:clamp(2rem,8vw,3.4rem);line-height:1;margin-bottom:1rem}
  .section-lede{color:var(--muted);line-height:1.7;max-width:36rem;margin-bottom:2.5rem}

  /* table */
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:.6rem;background:var(--panel);scrollbar-width:thin}
  table{width:100%;border-collapse:collapse;min-width:38rem;font-size:.92rem}
  thead th{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);text-align:left;
    padding:1.1rem 1.25rem;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:1.15rem 1.25rem;border-bottom:1px solid rgba(148,184,220,.07);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:rgba(56,189,248,.05)}
  td.model{font-weight:700;white-space:nowrap}
  td.model small{display:block;color:var(--faint);font-weight:400;font-size:.78rem;margin-top:.15rem}
  .pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    padding:.35rem .8rem;border-radius:999px}
  .pill.soon{background:rgba(163,230,53,.12);color:var(--lime);border:1px solid rgba(163,230,53,.3)}
  .pill.tbd{background:rgba(139,155,176,.1);color:var(--muted);border:1px solid var(--line)}
  .table-note{color:var(--faint);font-size:.82rem;margin-top:1rem;line-height:1.6}

  /* faq */
  #faq .wrap{max-width:48rem}
  .faq-item{border:1px solid var(--line);border-radius:.6rem;margin-bottom:.75rem;background:var(--panel);overflow:hidden}
  .faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:1rem;background:none;border:none;
    color:var(--ink);font-family:var(--sans);font-size:1rem;font-weight:600;text-align:left;padding:1.25rem 1.4rem;cursor:pointer}
  .faq-q .x{flex:0 0 auto;width:1.7rem;height:1.7rem;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;
    color:var(--accent);font-size:1rem;line-height:1;transition:transform .25s}
  .faq-item.open .faq-q .x{transform:rotate(45deg)}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .faq-a p{color:var(--muted);line-height:1.7;padding:0 1.4rem 1.4rem;font-size:.94rem}
  .faq-a a{color:var(--accent)}

  #contact .contact-card{border:1px solid var(--line);padding:2.5rem 1.5rem;text-align:center;background:var(--panel)}
  #contact h2{margin-bottom:.75rem}
  #contact p.lede2{color:var(--muted);margin-bottom:2rem;line-height:1.7}
  .cta-row{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center}
  footer{border-top:1px solid var(--line);padding:2rem 1.25rem 5rem;text-align:center;color:var(--faint);font-size:.82rem}
  .switcher{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:.25rem;
    background:rgba(3,5,9,.88);border:1px solid var(--line);border-radius:999px;padding:.3rem;backdrop-filter:blur(8px)}
  .switcher a{color:var(--muted);text-decoration:none;font-size:.75rem;letter-spacing:.08em;padding:.45rem .9rem;border-radius:999px}
  .switcher a.on{background:var(--accent);color:#032635;font-weight:700}
  @media (min-width:56rem){
    nav.top{padding:1.2rem 2.5rem}
    .hero-copy{padding:0 2.5rem}
    section{padding:7rem 2.5rem}
    .hero-meta{padding:1.25rem 2.5rem}
  }
  @media (prefers-reduced-motion:reduce){.faq-a{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/htm.js"></script>
<script>
const { useState, useRef, useEffect } = React;
const html = htm.bind(React.createElement);

const ROWS = [1,2,3,4,5,6,7].map(n => ({
  model: "Model " + String(n).padStart(2,"0"),
  sub: "Name coming soon",
  size: "Under 5 gal",
  dims: "TBD",
  price: "TBD",
  status: "Coming soon"
}));

const FAQS = [
  ["When does the sale go live?",
   "The date is not set yet. Call (217) 741-3237 and you'll hear it first."],
  ["What comes with each tank?",
   "Final specs for every model are still being finished. Every tank stays under five gallons. Call us and we'll walk you through what's planned."],
  ["Do you ship?",
   "Shipping details are coming soon. For now, the fastest answers are by phone or email."]
];

function Switcher(){
  const vs = [['index.html','V1'],['v2.html','V2'],['v3.html','V3'],['v4.html','V4']];
  const cur = (location.pathname.split('/').pop() || 'index.html');
  return html`<nav className="switcher" aria-label="Variations">
    ${vs.map(([href,label]) => html`<a key=${href} href=${href} className=${href===cur?'on':''}>${label}</a>`)}
  </nav>`;
}

function FaqItem({q, a}){
  const [open, setOpen] = useState(false);
  const bodyRef = useRef(null);
  const [h, setH] = useState(0);
  useEffect(() => { if(bodyRef.current) setH(bodyRef.current.scrollHeight); }, []);
  return html`<div className=${"faq-item"+(open?" open":"")}>
    <button className="faq-q" onClick=${() => setOpen(!open)} aria-expanded=${open}>
      <span>${q}</span><span className="x">+</span>
    </button>
    <div className="faq-a" style=${{maxHeight: open ? h+"px" : "0"}}>
      <p ref=${bodyRef}>${a}</p>
    </div>
  </div>`;
}

function App(){
  return html`<${React.Fragment}>
    <header className="hero">
      <div className="hero-inner">
        <nav className="top">
          <a className="brand" href="#">Boston\u2019s <span>ReefWorks</span></a>
          <div className="nav-links">
            <a href="#lineup">Lineup</a>
            <a href="#faq">FAQ</a>
            <a href="tel:+12177413237" className="nav-cta">Call us</a>
          </div>
        </nav>
        <div className="hero-copy">
          <p className="kicker">Pawnee, Illinois \u00B7 Nano reef tanks</p>
          <h1>The lineup.<br/><span className="thin">Side by side.</span></h1>
          <p className="lede">Seven nano reef tanks, <strong>under five gallons each</strong>. Compare the models, then call us about yours.</p>
          <div>
            <a className="btn btn-solid" href="#lineup">Compare models</a>
            <a className="btn btn-ghost" href="tel:+12177413237">(217) 741-3237</a>
          </div>
        </div>
        <div className="hero-meta">
          <div><b>7</b>Models</div>
          <div><b>Under 5 gal</b>Each tank</div>
          <div><b>IL</b>Built in Pawnee</div>
        </div>
      </div>
    </header>

    <section id="lineup"><div className="wrap">
      <p className="section-kicker">Full comparison</p>
      <h2>Every model. One table.</h2>
      <p className="section-lede">Dimensions and prices are still being finalized. What we know today is below.</p>
      <div className="table-scroll"><table>
        <thead><tr><th>Model</th><th>Size</th><th>Dimensions</th><th>Price</th><th>Status</th></tr></thead>
        <tbody>
          ${ROWS.map(r => html`<tr key=${r.model}>
            <td className="model">${r.model}<small>${r.sub}</small></td>
            <td>${r.size}</td>
            <td><span className="pill tbd">${r.dims}</span></td>
            <td><span className="pill tbd">${r.price}</span></td>
            <td><span className="pill soon">${r.status}</span></td>
          </tr>`)}
        </tbody>
      </table></div>
      <p className="table-note">TBD means the final number is not published yet. Call (217) 741-3237 for the latest on any model.</p>
    </div></section>

    <section id="faq"><div className="wrap">
      <p className="section-kicker" style=${{textAlign:'left'}}>Questions</p>
      <h2 style=${{textAlign:'left'}}>Straight answers.</h2>
      <p className="section-lede" style=${{textAlign:'left',marginLeft:0}}>What we know, what we don't, and where to ask.</p>
      ${FAQS.map(([q,a]) => html`<${FaqItem} key=${q} q=${q} a=${a}/>`)}
    </div></section>

    <section id="contact"><div className="wrap"><div className="contact-card">
      <p className="section-kicker">Get in touch</p>
      <h2>Talk to us about your tank.</h2>
      <p className="lede2">Questions about a model, or want first word when the sale goes live?</p>
      <div className="cta-row">
        <a className="btn btn-solid" href="tel:+12177413237">(217) 741-3237</a>
        <a className="btn btn-ghost" href="mailto:bostonsreefworks@outlook.com">Email us</a>
      </div>
    </div></div></section>

    <footer><p>Boston\u2019s ReefWorks \u00B7 Pawnee, Illinois \u00B7 \u00A9 2026</p></footer>
    <${Switcher}/>
  </${React.Fragment}>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
